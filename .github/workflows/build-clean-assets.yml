name: Build Minecraft Clean Assets

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target version or bundle to build'
        type: choice
        default: 'universal'
        options:
          - 'universal'
          - 'all'
          - '1.21.4'
          - '1.21.1'
          - '1.20.4'
          - '1.20.1'
          - '1.19.4'
          - '1.18.2'
          - '1.17.1'
          - '1.16.5'
      keep_records:
        description: 'Keep Jukebox Music Discs / Records'
        type: boolean
        default: true

jobs:
  build:
    name: Build Clean Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Clean Assets
        run: |
          RECORDS_FLAG=""
          if [ "${{ inputs.keep_records }}" = "false" ]; then
            RECORDS_FLAG="--no-records"
          fi
          
          TARGET="${{ inputs.target }}"
          echo "Building target: $TARGET"
          
          mkdir -p dist
          if [ "$TARGET" = "universal" ]; then
            python3 generator.py --universal --out dist $RECORDS_FLAG
          elif [ "$TARGET" = "all" ]; then
            python3 generator.py --all --out dist $RECORDS_FLAG
          else
            python3 generator.py "$TARGET" --out dist $RECORDS_FLAG
          fi

      - name: Upload Clean Assets Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Clean-Assets
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for zipfile in dist/*.zip; do
            [ -f "$zipfile" ] || continue
            fname=$(basename "$zipfile")
            
            if echo "$fname" | grep -q "Universal"; then
              TAG="universal"
              TITLE="Minecraft Universal Clean Assets (1.16 to Latest)"
              BODY="### 🎮 Minecraft Universal Clean Assets for PojavLauncher
          - **Supported Versions**: Minecraft 1.16 through Latest in a single bundle.
          - **Size Savings**: Stripped ambient music tracks (~300MB+ stripped).
          - **Preserved**: 100% SFX, language files, and UI textures intact.
          - **Format**: Ready for instant one-tap extraction into .minecraft/assets/."
            else
              VER=$(echo "$fname" | sed -E 's/Minecraft-(.*)-Filtered-Assets\.zip/\1/')
              TAG="v${VER}"
              TITLE="Minecraft ${VER} Clean Assets"
              BODY="### 🎮 Minecraft ${VER} Clean Assets for PojavLauncher
          - **Stripped**: Ambient background music (~300MB+ saved)
          - **Preserved**: 100% sound effects (mobs, blocks, steps, items, entities, ambient, UI), languages, and GUI textures.
          - **Compatibility**: Ready for instant one-tap extraction into .minecraft/assets/."
            fi
            
            echo "Publishing release: $TAG with $fname"
            gh release create "$TAG" "$zipfile" \
              --title "$TITLE" \
              --notes "$BODY" \
              --clobber || gh release upload "$TAG" "$zipfile" --clobber
          done
